name: Diagnose new supplier candidates

on:
  push:
    paths:
      - ".github/workflows/diagnose-new-suppliers.yml"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.13.1"
          cache: npm
      - run: npm ci
      - name: Probe candidate supplier search and product pages
        run: |
          node --input-type=module <<'NODE'
          import * as cheerio from "cheerio";
          const ua="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/154.0 Safari/537.36";
          const cases=[
            {id:"dentipak",search:"https://www.dentipak.es/shop?search=41294",match:/scotch|41294/i},
            {id:"dentalboom",search:"https://dentalboom.com/?s=Scotchbond+Universal+Plus&post_type=product",match:/scotch/i},
            {id:"dentalsegurite",search:"https://dentalsegurite.es/?s=Scotchbond+Universal+Plus&post_type=product",match:/scotch/i},
            {id:"dentaldeposito",search:"https://dentaldeposito.com/?s=Scotchbond+Universal+Plus&post_type=product",match:/scotch/i}
          ];
          for(const item of cases){
            console.log("\n### CANDIDATE",item.id);
            try{
              const r=await fetch(item.search,{redirect:"follow",headers:{"user-agent":ua,"accept":"text/html,application/xhtml+xml"}});
              const html=await r.text(),$=cheerio.load(html);
              const links=$("a[href]").toArray().map(a=>({href:$(a).attr("href"),text:$(a).text().replace(/\s+/g," ").trim()}))
                .filter(x=>item.match.test((x.text||"")+" "+(x.href||""))).slice(0,15);
              console.log("SEARCH",JSON.stringify({status:r.status,final:r.url,len:html.length,title:$("title").text().trim(),links},null,2));
              const product=links.map(x=>x.href).find(Boolean);
              if(product){
                let url;
                try{url=new URL(product,r.url).toString();}catch{url=product;}
                const pr=await fetch(url,{redirect:"follow",headers:{"user-agent":ua,"accept":"text/html,application/xhtml+xml"}});
                const ph=await pr.text(),p$=cheerio.load(ph);
                const body=p$("body").text().replace(/\s+/g," ").trim();
                console.log("PRODUCT",JSON.stringify({
                  status:pr.status,url:pr.url,len:ph.length,title:p$("h1").first().text().replace(/\s+/g," ").trim(),
                  text:body.slice(0,6000),
                  ld:p$('script[type="application/ld+json"]').toArray().map(x=>p$(x).text()).filter(x=>/Product|Offer|price|sku|mpn/i.test(x)).slice(0,5)
                },null,2));
              }
            }catch(e){console.log("ERROR",e instanceof Error?e.message:String(e));}
          }
          NODE

      - name: Deep inspect Dentipak and Dental Boom
        run: |
          node --input-type=module <<'NODE'
          import * as cheerio from "cheerio";
          const ua="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/154.0 Safari/537.36";
          async function inspect(name,url){
            const r=await fetch(url,{redirect:"follow",headers:{"user-agent":ua,"accept":"text/html,application/xhtml+xml"}});
            const html=await r.text(),$=cheerio.load(html);
            const body=$("body").text().replace(/\s+/g," ").trim();
            console.log("\n### DEEP",name,"HTTP",r.status,"URL",r.url,"LEN",html.length);
            console.log("TITLE",$("h1").first().text().replace(/\s+/g," ").trim());
            console.log("BODY",body.slice(0,12000));
            console.log("LD",JSON.stringify($('script[type="application/ld+json"]').toArray().map(x=>$(x).text()).filter(x=>/Product|Offer|price|sku|mpn|availability/i.test(x)).slice(0,8),null,2));
            for(const re of [
              /41294.{0,800}/gi,/059652.{0,800}/gi,/sku.{0,800}/gi,/mpn.{0,800}/gi,/reference.{0,800}/gi,/referencia.{0,800}/gi,
              /stock.{0,1000}/gi,/availability.{0,1000}/gi,/tax.{0,1000}/gi,/iva.{0,1000}/gi,/list_price.{0,1000}/gi,
              /product_template_id.{0,1000}/gi,/product_id.{0,1000}/gi,/price.{0,1000}/gi
            ]) console.log("PATTERN",String(re),JSON.stringify((html.match(re)||[]).slice(0,20),null,2));
          }
          await inspect("dentipak","https://www.dentipak.es/shop/041299-adhesivo-scotchbond-universal-plus-5-ml-41294-3m-solventum-6987");
          await inspect("dentalboom","https://dentalboom.com/shop/restauracion/adhesivos/scotchbond-universal-plus/");
          for(const url of [
            "https://www.dentipak.es/website_sale/get_combination_info",
            "https://www.dentipak.es/shop/cart/update_json",
            "https://dentalboom.com/wp-json/wc/store/v1/products?search=Scotchbond%20Universal%20Plus",
            "https://dentalboom.com/wp-json/wc/v3/products?search=Scotchbond%20Universal%20Plus"
          ]){
            try{
              const r=await fetch(url,{headers:{"user-agent":ua,"accept":"application/json,text/plain,*/*"}});
              const text=await r.text();
              console.log("\n### API",url,"HTTP",r.status,"CT",r.headers.get("content-type"),"LEN",text.length);
              console.log(text.slice(0,12000));
            }catch(e){console.log("APIERR",url,e.message);}
          }
          NODE
