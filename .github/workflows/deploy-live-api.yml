name: Deploy live price API

on:
  workflow_dispatch:
  push:
    paths:
      - "worker/**"
      - "src/connectors/**"
      - "src/domain/**"
      - "src/types/**"
      - "data/products.json"
      - "data/supplier-seeds.json"
      - "data/supplier-policies.json"
      - "data/price-history.json"
      - "wrangler.toml"
      - ".github/workflows/deploy-live-api.yml"

concurrency:
  group: dental-price-live-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.13.1"
          cache: npm
      - run: npm ci
      - name: Check Cloudflare configuration
        id: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare secrets are not configured; live API deployment skipped."
          fi
      - name: Deploy Worker
        if: steps.cloudflare.outputs.configured == 'true'
        run: npx --yes wrangler@4.45.0 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke test dynamic search API
        if: steps.cloudflare.outputs.configured == 'true'
        run: |
          sleep 4
          check() {
            name="$1"
            url="$2"
            code=$(curl --max-time 25 --silent --show-error --output "/tmp/$name.json" --write-out "%{http_code}" "$url" || true)
            echo "=== $name HTTP $code ==="
            cat "/tmp/$name.json" || true
            echo
            if [ "$code" != "200" ]; then exit 1; fi
          }
          check health "https://dental-price-live.avance-dental74.workers.dev/health"
          check dentaltix "https://dental-price-live.avance-dental74.workers.dev/search-supplier?q=4910A3B&supplier=dentaltix&sessionId=smoke-search"
          check dentaltix_name "https://dental-price-live.avance-dental74.workers.dev/search-supplier?q=Tetric%20EvoCeram&supplier=dentaltix&sessionId=smoke-search"
          check dentaltix_model "https://dental-price-live.avance-dental74.workers.dev/search-supplier?q=Z250&supplier=dentaltix&sessionId=smoke-search"
          check dentalcost "https://dental-price-live.avance-dental74.workers.dev/search-supplier?q=4910A3B&supplier=dentalcost&sessionId=smoke-search"
          check dentalcost_name "https://dental-price-live.avance-dental74.workers.dev/search-supplier?q=Tetric%20EvoCeram&supplier=dentalcost&sessionId=smoke-search"
          check dentalexpress "https://dental-price-live.avance-dental74.workers.dev/search-supplier?q=41294&supplier=dentalexpress&sessionId=smoke-search"
          check ortolan "https://dental-price-live.avance-dental74.workers.dev/search-supplier?q=Tetric%20EvoCeram&supplier=ortolan&sessionId=smoke-search"
          check ortolan_dentin "https://dental-price-live.avance-dental74.workers.dev/search-supplier?q=Tetric%20EvoCeram%20A3%2C5%20Dentina&supplier=ortolan&sessionId=smoke-search"
          check dvd "https://dental-price-live.avance-dental74.workers.dev/search-supplier?q=Scotchbond%20Universal%20Plus&supplier=dvd-dental&sessionId=smoke-search"
          check dvd_name "https://dental-price-live.avance-dental74.workers.dev/search-supplier?q=Tetric%20EvoCeram&supplier=dvd-dental&sessionId=smoke-search"
          check dentipak "https://dental-price-live.avance-dental74.workers.dev/search-supplier?q=41294&supplier=dentipak&sessionId=smoke-search"
          check dentalboom "https://dental-price-live.avance-dental74.workers.dev/search-supplier?q=Scotchbond%20Universal%20Plus&supplier=dentalboom&sessionId=smoke-search"
          node <<'NODE'
          const fs=require("fs");
          const h=JSON.parse(fs.readFileSync("/tmp/health.json"));
          if(!h.ok||h.searchMode!=="dynamic-per-supplier") process.exit(1);
          if(!Array.isArray(h.suppliers)||h.suppliers.length!==7) process.exit(1);
          if(!Array.isArray(h.protectedSuppliers)||h.protectedSuppliers.length!==3) process.exit(1);
          for(const name of ["dentaltix","dentaltix_name","dentaltix_model","dentalcost","dentalcost_name","dentalexpress","ortolan","dvd","dvd_name","dentipak","dentalboom"]){
            const x=JSON.parse(fs.readFileSync("/tmp/"+name+".json"));
            console.log(name,JSON.stringify({offers:x.offers?.length,error:x.error,noMatch:x.noMatch,source:x.discoveredFrom,refs:x.offers?.map(o=>o.manufacturerReference)}));
            if(x.sessionId!=="smoke-search"||!Array.isArray(x.offers)||x.error) process.exit(1);
            // Dental Express is queryable but may deliberately return noMatch when the
            // product page exposes no product-scoped price. Never make the smoke test
            // reward the old unsafe whole-page price fallback.
            if(!["dentalexpress","dentalcost_name"].includes(name)&&x.offers.length<1) process.exit(1);
            if(["dentaltix_name","dvd_name","dentalcost_name"].includes(name)&&!x.offers.every(o=>{
              const hay=((o.rawName||"")+" "+(o.manufacturer||"")).toLowerCase();
              return hay.includes("tetric")&&hay.includes("evoceram");
            })) process.exit(1);
          }
          const dtxModel=JSON.parse(fs.readFileSync("/tmp/dentaltix_model.json"));
          if(!dtxModel.offers.length||!dtxModel.offers.every(o=>(o.rawName||"").toLowerCase().includes("z250"))) process.exit(1);
          const dtx=JSON.parse(fs.readFileSync("/tmp/dentaltix.json"));
          if(!dtx.offers.some(o=>o.manufacturerReference==="4910A3B"&&o.vatStatus==="excluded"&&o.vatRate===10)) process.exit(1);
          const dtxName=JSON.parse(fs.readFileSync("/tmp/dentaltix_name.json"));
          if(!dtxName.offers.every(o=>o.vatStatus==="excluded"&&o.vatRate===10)) process.exit(1);
          const od=JSON.parse(fs.readFileSync("/tmp/ortolan_dentin.json"));
          console.log("ortolan_dentin",JSON.stringify({offers:od.offers?.length,error:od.error,noMatch:od.noMatch}));
          if(od.sessionId!=="smoke-search"||!Array.isArray(od.offers)||od.error) process.exit(1);
          if(!od.offers.some(o=>o.shade==="A3.5"&&o.variant==="Dentin"&&o.presentation==="Jeringa"&&o.packCount===1&&o.stockStatus==="in_stock")) process.exit(1);
          if(!od.offers.some(o=>o.shade==="A3.5"&&o.variant==="Dentin"&&o.presentation==="Cápsulas"&&o.quantity===0.2&&o.packCount===20)) process.exit(1);
          const dp=JSON.parse(fs.readFileSync("/tmp/dentipak.json"));
          if(!dp.offers.some(o=>o.manufacturerReference==="41294"&&o.supplierSku==="041299"&&Number.isFinite(o.salePrice)&&o.salePrice>0&&o.stockStatus==="in_stock")) process.exit(1);
          const db=JSON.parse(fs.readFileSync("/tmp/dentalboom.json"));
          if(!db.offers.some(o=>o.supplierSku==="059652"&&Number.isFinite(o.salePrice)&&o.salePrice>0&&o.vatStatus==="excluded"&&o.vatRate===10&&o.stockStatus==="in_stock"&&!o.manufacturerReference)) process.exit(1);
          NODE
