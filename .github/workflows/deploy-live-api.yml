name: Deploy live price API

on:
  workflow_dispatch:
  push:
    paths:
      - "worker/**"
      - "src/connectors/**"
      - "src/domain/**"
      - "src/types/**"
      - "data/products.json"
      - "data/supplier-seeds.json"
      - "data/supplier-policies.json"
      - "wrangler.toml"
      - ".github/workflows/deploy-live-api.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.13.1"
          cache: npm
      - run: npm ci
      - name: Check Cloudflare configuration
        id: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare secrets are not configured; live API deployment skipped."
          fi
      - name: Deploy Worker
        if: steps.cloudflare.outputs.configured == 'true'
        run: npx --yes wrangler@4.45.0 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke test dynamic search API
        if: steps.cloudflare.outputs.configured == 'true'
        run: |
          sleep 4
          check() {
            name="$1"
            url="$2"
            code=$(curl --silent --show-error --output "/tmp/$name.json" --write-out "%{http_code}" "$url" || true)
            echo "=== $name HTTP $code ==="
            cat "/tmp/$name.json" || true
            echo
            if [ "$code" != "200" ]; then exit 1; fi
          }
          check health "https://dental-price-live.avance-dental74.workers.dev/health"
          check search "https://dental-price-live.avance-dental74.workers.dev/search-supplier?q=4910A3B&supplier=dentaltix&sessionId=smoke-search"
          node -e 'const fs=require("fs"); const h=JSON.parse(fs.readFileSync("/tmp/health.json")); const search=JSON.parse(fs.readFileSync("/tmp/search.json")); if(!h.ok||h.searchMode!=="dynamic-per-supplier"||search.sessionId!=="smoke-search"||!Array.isArray(search.offers)||search.offers.length<1) process.exit(1); console.log(JSON.stringify({health:h,search:{supplier:search.supplierId,offers:search.offers.length,error:search.error,source:search.discoveredFrom,refs:search.offers.map(o=>o.manufacturerReference)}},null,2));'
