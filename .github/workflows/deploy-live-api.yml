name: Deploy live price API

on:
  workflow_dispatch:
  push:
    paths:
      - "worker/**"
      - "src/connectors/**"
      - "src/domain/**"
      - "src/types/**"
      - "data/products.json"
      - "data/supplier-seeds.json"
      - "data/supplier-policies.json"
      - "wrangler.toml"
      - ".github/workflows/deploy-live-api.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.13.1"
          cache: npm
      - run: npm ci
      - name: Deploy Worker
        run: npx --yes wrangler@4.45.0 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
