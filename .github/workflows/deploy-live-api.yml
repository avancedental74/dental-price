name: Deploy live price API

on:
  workflow_dispatch:
  push:
    paths:
      - "worker/**"
      - "src/connectors/**"
      - "src/domain/**"
      - "src/types/**"
      - "data/products.json"
      - "data/supplier-seeds.json"
      - "data/supplier-policies.json"
      - "wrangler.toml"
      - ".github/workflows/deploy-live-api.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.13.1"
          cache: npm
      - run: npm ci
      - name: Check Cloudflare configuration
        id: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare secrets are not configured; live API deployment skipped."
          fi
      - name: Deploy Worker
        if: steps.cloudflare.outputs.configured == 'true'
        run: npx --yes wrangler@4.45.0 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
