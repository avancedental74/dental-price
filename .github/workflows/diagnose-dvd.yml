name: Diagnose DVD Dental

on:
  push:
    paths:
      - "scripts/diagnose-dvd.ts"
      - ".github/workflows/diagnose-dvd.yml"
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.13.1"
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/diagnose-dvd.ts
