name: Generate npm lockfile

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/generate-lockfile.yml"
      - "package.json"

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"
      - run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile unchanged"
            exit 0
          fi
          git config user.name "dental-price-bot"
          git config user.email "dental-price-bot@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: generate npm lockfile"
          git push