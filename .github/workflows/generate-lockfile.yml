name: Generate npm lockfile v2

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/generate-lockfile.yml"
      - "package.json"

permissions:
  contents: write

concurrency:
  group: dental-price-data-writes
  cancel-in-progress: false

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "22.13.1"
      - run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile
        run: |
          if [ -z "$(git status --porcelain -- package-lock.json)" ]; then
            echo "Lockfile unchanged"
            exit 0
          fi
          git config user.name "dental-price-bot"
          git config user.email "dental-price-bot@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: generate npm lockfile"
          git pull --rebase origin main
          git push origin HEAD:main