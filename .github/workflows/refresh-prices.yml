name: Refresh public prices

on:
  workflow_dispatch:
  push:
    paths:
      - "data/supplier-seeds.json"
      - "data/products.json"
      - "src/connectors/**"
      - "scripts/refresh-prices.ts"
      - "package-lock.json"
      - ".github/workflows/refresh-prices.yml"
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: write

concurrency:
  group: dental-price-data-writes
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "22.13.1"
          cache: npm
      - run: npm ci
      - run: npm run refresh
      - run: npm run validate:data
      - name: Commit refreshed data
        run: |
          if [ -z "$(git status --porcelain -- data/current-prices.json data/price-history.json data/connector-status.json)" ]; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "dental-price-bot"
          git config user.email "dental-price-bot@users.noreply.github.com"
          git add data/current-prices.json data/price-history.json data/connector-status.json
          git commit -m "data: refresh public prices"
          git pull --rebase origin main
          git push origin HEAD:main
# manual-current-state-trigger-v2
