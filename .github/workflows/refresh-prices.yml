name: Refresh public prices

on:
  workflow_dispatch:
  push:
    paths:
      - "data/supplier-seeds.json"
      - "data/products.json"
      - "data/supplier-policies.json"
      - "src/connectors/**"
      - "src/domain/**"
      - "scripts/refresh-prices.ts"
      - "package-lock.json"
      - ".github/workflows/refresh-prices.yml"
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: write

concurrency:
  group: dental-price-data-writes
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "22.13.1"
          cache: npm
      - run: npm ci
      - name: Refresh, validate and commit generated data
        run: |
          set -e
          git config user.name "dental-price-bot"
          git config user.email "dental-price-bot@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            npm run refresh
            npm run validate:data

            if [ -z "$(git status --porcelain -- data/current-prices.json data/price-history.json data/connector-status.json data/metrics.json)" ]; then
              echo "No data changes"
              exit 0
            fi

            git add data/current-prices.json data/price-history.json data/connector-status.json data/metrics.json
            git commit -m "data: refresh public prices"

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "main changed during refresh; regenerating against latest main (attempt $attempt)"
            sleep 2
          done

          echo "Could not publish refreshed data after 3 attempts"
          exit 1

