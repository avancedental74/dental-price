name: Refresh supplier policies

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/refresh-supplier-policies.ts"
      - "data/supplier-policies.json"
      - ".github/workflows/refresh-supplier-policies.yml"
  schedule:
    - cron: "33 4 * * 1"

permissions:
  contents: write

concurrency:
  group: supplier-policy-refresh
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "22.13.1"
          cache: npm
      - run: npm ci
      - name: Verify public shipping policies
        run: npx tsx scripts/refresh-supplier-policies.ts
      - run: npm run validate:data
      - name: Commit verified policy timestamp
        shell: bash
        run: |
          if git diff --quiet -- data/supplier-policies.json; then
            echo "No policy changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/supplier-policies.json
          git commit -m "data: refresh verified supplier shipping policies"
          git pull --rebase origin main
          git push origin HEAD:main