name: Diagnose supplier search forms

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/diagnose-supplier-search.yml"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.13.1"
          cache: npm
      - run: npm ci
      - name: Probe deployed dynamic supplier endpoints
        run: |
          BASE="https://dental-price-live.avance-dental74.workers.dev/search-supplier"
          probe() {
            supplier="$1"
            query="$2"
            echo "### LIVE $supplier :: $query"
            curl --max-time 20 --silent --show-error --get "$BASE" \
              --data-urlencode "supplier=$supplier" \
              --data-urlencode "q=$query" \
              --data-urlencode "sessionId=diagnostic-live" || true
            echo
          }
          probe dentaltix "4910A3B"
          probe dentalcost "4910A3B"
          probe dentalexpress "41294"
          probe ortolan "Tetric EvoCeram"
          probe dvd-dental "Scotchbond Universal Plus"
      - name: Inspect Dental Express product identifiers
        run: |
          node --input-type=module <<'NODE'
          import * as cheerio from "cheerio";
          const url="https://dentalexpress.es/adhesivo-scotchbond-universal-plus-5ml-solventum";
          const r=await fetch(url,{headers:{"user-agent":"Mozilla/5.0","accept":"text/html"}});
          const html=await r.text();
          const $=cheerio.load(html);
          const body=$("body").text().replace(/\s+/g," ");
          console.log("DEX HTTP",r.status,"LEN",html.length);
          console.log("41294 POS",body.indexOf("41294"));
          for(const re of [/Referencia.{0,160}/gi,/41294.{0,200}/gi,/sku.{0,200}/gi,/mpn.{0,200}/gi]){
            console.log(String(re),JSON.stringify((body.match(re)||[]).slice(0,20)));
          }
          console.log("LD",JSON.stringify($('script[type="application/ld+json"]').toArray().map(x=>$(x).text()).filter(x=>/Product|41294|sku|mpn/i.test(x)).slice(0,6),null,2));
          NODE
      - name: Inspect DVD Klevu configuration
        run: |
          node --input-type=module <<'NODE'
          const url="https://www.dvd-dental.com/search.php?search_query=Scotchbond%20Universal%20Plus";
          const r=await fetch(url,{headers:{"user-agent":"Mozilla/5.0","accept":"text/html"}});
          const html=await r.text();
          console.log("DVD HTTP",r.status,"LEN",html.length);
          const patterns=[/klevu.{0,500}/gi,/apiKey.{0,300}/gi,/searchUrl.{0,300}/gi,/cloudSearchUrl.{0,300}/gi,/restapi.{0,300}/gi];
          for(const re of patterns)console.log(String(re),JSON.stringify((html.match(re)||[]).slice(0,20),null,2));
          NODE
