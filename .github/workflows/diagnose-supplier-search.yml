name: Diagnose supplier search forms

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/diagnose-supplier-search.yml"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.13.1"
          cache: npm
      - run: npm ci
      - name: Probe deployed dynamic supplier endpoints
        run: |
          BASE="https://dental-price-live.avance-dental74.workers.dev/search-supplier"
          probe() {
            supplier="$1"
            query="$2"
            echo "### LIVE $supplier :: $query"
            curl --max-time 20 --silent --show-error --get "$BASE" \
              --data-urlencode "supplier=$supplier" \
              --data-urlencode "q=$query" \
              --data-urlencode "sessionId=diagnostic-live" || true
            echo
          }
          probe dentaltix "4910A3B"
          probe dentalcost "4910A3B"
          probe dentalexpress "41294"
          probe ortolan "Tetric EvoCeram"
          probe dvd-dental "Scotchbond Universal Plus"
      - name: Inspect Dental Express product identifiers
        run: |
          node --input-type=module <<'NODE'
          import * as cheerio from "cheerio";
          const url="https://dentalexpress.es/adhesivo-scotchbond-universal-plus-5ml-solventum";
          const r=await fetch(url,{headers:{"user-agent":"Mozilla/5.0","accept":"text/html"}});
          const html=await r.text();
          const $=cheerio.load(html);
          const body=$("body").text().replace(/\s+/g," ");
          console.log("DEX HTTP",r.status,"LEN",html.length);
          console.log("41294 POS",body.indexOf("41294"));
          for(const re of [/Referencia.{0,160}/gi,/41294.{0,200}/gi,/sku.{0,200}/gi,/mpn.{0,200}/gi]){
            console.log(String(re),JSON.stringify((body.match(re)||[]).slice(0,20)));
          }
          console.log("LD",JSON.stringify($('script[type="application/ld+json"]').toArray().map(x=>$(x).text()).filter(x=>/Product|41294|sku|mpn/i.test(x)).slice(0,6),null,2));
          NODE
      - name: Inspect DVD Klevu configuration
        run: |
          node --input-type=module <<'NODE'
          const url="https://www.dvd-dental.com/search.php?search_query=Scotchbond%20Universal%20Plus";
          const r=await fetch(url,{headers:{"user-agent":"Mozilla/5.0","accept":"text/html"}});
          const html=await r.text();
          console.log("DVD HTTP",r.status,"LEN",html.length);
          const patterns=[/klevu.{0,500}/gi,/apiKey.{0,300}/gi,/searchUrl.{0,300}/gi,/cloudSearchUrl.{0,300}/gi,/restapi.{0,300}/gi];
          for(const re of patterns)console.log(String(re),JSON.stringify((html.match(re)||[]).slice(0,20),null,2));
          const optionStart=html.indexOf("var options");
          console.log("DVD KLEVU OPTIONS",optionStart>=0?html.slice(optionStart,optionStart+3000).replace(/\s+/g," "):"none");
          const searchEndpoint=html.match(/search\s*:\s*['"]([^'"]*ksearchnet[^'"]*)['"]/i)?.[1];
          console.log("DVD KLEVU ENDPOINT",searchEndpoint||"none");
          NODE
      - name: Probe DVD Klevu API directly
        run: |
          node --input-type=module <<'NODE'
          const endpoint="https://eucs34v2.ksearchnet.com/cs/v2/search";
          const apiKey="klevu-174436997355118006";
          const body={
            context:{apiKeys:[apiKey]},
            recordQueries:[{
              id:"productSearch",
              typeOfRequest:"SEARCH",
              settings:{query:{term:"Scotchbond Universal Plus"},limit:5,typeOfRecords:["KLEVU_PRODUCT"]}
            }]
          };
          const r=await fetch(endpoint,{method:"POST",headers:{"content-type":"application/json","accept":"application/json"},body:JSON.stringify(body)});
          const text=await r.text();
          console.log("DVD KLEVU API HTTP",r.status);
          console.log(text.slice(0,20000));
          NODE
      - name: Probe remaining supplier search paths
        run: |
          node --input-type=module <<'NODE'
          import * as cheerio from "cheerio";
          const tests={
            proclinic:[
              "https://www.proclinic.es/tienda/catalogsearch/result/?q=Scotchbond%20Universal%20Plus",
              "https://www.proclinic.es/tienda/search?q=Scotchbond%20Universal%20Plus",
              "https://www.proclinic.es/tienda/buscar?q=Scotchbond%20Universal%20Plus"
            ],
            dentaliberica:[
              "https://dentaliberica.com/?s=Filtek%20Z250&post_type=product",
              "https://dentaliberica.com/es/busqueda?controller=search&s=Filtek%20Z250",
              "https://dentaliberica.com/search?controller=search&s=Filtek%20Z250"
            ],
            broker:[
              "https://www.brokerdental.es/catalogsearch/result/?q=Scotchbond",
              "https://www.brokerdental.es/search?controller=search&s=Scotchbond",
              "https://www.brokerdental.es/?s=Scotchbond&post_type=product"
            ]
          };
          for(const [supplier,urls] of Object.entries(tests)){
            console.log("\n### REMAINING",supplier);
            for(const url of urls){
              try{
                const r=await fetch(url,{redirect:"follow",headers:{"user-agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/154.0 Safari/537.36","accept":"text/html,application/xhtml+xml"}});
                const html=await r.text();
                const $=cheerio.load(html);
                const candidates=$("a[href]").toArray().map(a=>({href:$(a).attr("href"),text:$(a).text().replace(/\s+/g," ").trim()}))
                  .filter(x=>/scotch|filtek|z250/i.test((x.text||"")+" "+(x.href||""))).slice(0,12);
                console.log(JSON.stringify({url,status:r.status,final:r.url,len:html.length,title:$("title").text().trim(),candidates},null,2));
              }catch(e){console.log(JSON.stringify({url,error:e.message}));}
            }
          }
          NODE
      - name: Probe protected supplier catalog APIs
        run: |
          node --input-type=module <<'NODE'
          async function probe(name,url,init={}){
            try{
              const r=await fetch(url,{redirect:"follow",headers:{"user-agent":"Mozilla/5.0","accept":"application/json,text/plain,*/*",...(init.headers||{})},...init});
              const text=await r.text();
              console.log("\n### API",name,"HTTP",r.status,"URL",r.url,"CT",r.headers.get("content-type"),"LEN",text.length);
              console.log(text.slice(0,7000));
            }catch(e){console.log("\n### API",name,"ERROR",e.message);}
          }
          const gqlQuery=JSON.stringify({query:`query { products(search: "Scotchbond Universal Plus", pageSize: 5) { total_count items { name sku url_key price_range { minimum_price { final_price { value currency } regular_price { value currency } } } stock_status } } }`});
          await probe("proclinic-graphql","https://www.proclinic.es/tienda/graphql",{method:"POST",headers:{"content-type":"application/json"},body:gqlQuery});
          await probe("proclinic-rest-search","https://www.proclinic.es/tienda/rest/V1/products?searchCriteria[pageSize]=5&searchCriteria[filter_groups][0][filters][0][field]=name&searchCriteria[filter_groups][0][filters][0][value]=%25Scotchbond%25&searchCriteria[filter_groups][0][filters][0][condition_type]=like");
          await probe("broker-graphql","https://www.brokerdental.es/graphql",{method:"POST",headers:{"content-type":"application/json"},body:gqlQuery});
          await probe("broker-rest-search","https://www.brokerdental.es/rest/V1/products?searchCriteria[pageSize]=5&searchCriteria[filter_groups][0][filters][0][field]=name&searchCriteria[filter_groups][0][filters][0][value]=%25Scotchbond%25&searchCriteria[filter_groups][0][filters][0][condition_type]=like");
          for(const url of [
            "https://dentaliberica.com/api/products?output_format=JSON&display=full&filter[name]=%25Filtek%25",
            "https://dentaliberica.com/es/module/iqitsearch/searchiqit?ajax=true&query=Filtek",
            "https://dentaliberica.com/module/iqitsearch/searchiqit?ajax=true&query=Filtek",
            "https://dentaliberica.com/index.php?controller=search&s=Filtek&ajax=1"
          ]) await probe("dentaliberica-api",url);
          NODE
      - name: Probe unseeded product name across live suppliers
        run: |
          BASE="https://dental-price-live.avance-dental74.workers.dev/search-supplier"
          for supplier in dentaltix dentalcost dentalexpress ortolan dvd-dental; do
            echo "### UNSEEDED $supplier"
            curl --max-time 25 --silent --show-error --get "$BASE"               --data-urlencode "supplier=$supplier"               --data-urlencode "q=Tetric EvoCeram"               --data-urlencode "sessionId=unseeded-name-test" || true
            echo
          done

      - name: Inspect current discovery ranking
        run: |
          npx tsx <<'TS'
          import { discoverSupplierProductUrls } from "./src/connectors/live-search.ts";
          for (const [supplier,q] of [
            ["dentaltix","4910A3B"],
            ["dentalcost","4910A3B"],
            ["dentaltix","Tetric EvoCeram"],
            ["dentalcost","Tetric EvoCeram"]
          ]) {
            try {
              const r=await discoverSupplierProductUrls(supplier,q,fetch,5);
              console.log("DISCOVERY",supplier,q,JSON.stringify(r));
            } catch (e) {
              console.log("DISCOVERY_ERR",supplier,q,e instanceof Error?e.message:String(e));
            }
          }
          TS

      - name: Deep inspect Dentaltix and DentalCost exact search
        run: |
          npx tsx <<'TS'
          import * as cheerio from "cheerio";
          import { fetchDentaltixProduct } from "./src/connectors/dentaltix/index.ts";
          const dtxUrl="https://www.dentaltix.com/es/3m/filtek-supreme-xte-kit-composite-profesional-12-jer";
          try {
            const dtx=await fetchDentaltixProduct(dtxUrl);
            console.log("DTX_RAW",JSON.stringify({
              title:dtx.raw.title,
              pageSupplierSku:dtx.raw.pageSupplierSku,
              pageManufacturerReference:dtx.raw.pageManufacturerReference,
              variants:dtx.raw.variants.length,
              refs:dtx.raw.variants.slice(0,80).map(v=>({sku:v.supplierSku,ref:v.manufacturerReference,title:v.title}))
            }));
            console.log("DTX_MATCH_4910",JSON.stringify(dtx.offers.filter(o=>(o.manufacturerReference||"").includes("4910A3B")||(o.supplierSku||"").includes("4910A3B"))));
          } catch(e) { console.log("DTX_DEEP_ERR",e instanceof Error?e.message:String(e)); }

          try {
            const url="https://www.dentalcost.es/?controller=search&search_query=4910A3B";
            const res=await fetch(url,{headers:{"user-agent":"Mozilla/5.0","accept":"text/html,application/xhtml+xml"}});
            const html=await res.text();
            const $=cheerio.load(html);
            const rows=[];
            $("a[href]").each((_,a)=>{
              const href=$(a).attr("href")||"";
              const text=$(a).text().replace(/\s+/g," ").trim();
              const parent=$(a).closest("article,li,div.product-container,div.product-miniature,div.ajax_block_product,div.product-box").first();
              const parentText=parent.text().replace(/\s+/g," ").trim().slice(0,500);
              if(/687-|filtek|4910a3b|supreme/i.test(href+" "+text+" "+parentText)){
                rows.push({href,text,tag:parent.prop("tagName"),cls:parent.attr("class"),parentText});
              }
            });
            console.log("DCOST_EXACT_DOM",JSON.stringify(rows.slice(0,50)));
          } catch(e) { console.log("DCOST_DEEP_ERR",e instanceof Error?e.message:String(e)); }
          TS

      - name: Inspect Dentaltix Nuxt roots
        run: |
          node --input-type=module <<'NODE'
          import * as cheerio from "cheerio";
          const url="https://www.dentaltix.com/es/3m/filtek-supreme-xte-kit-composite-profesional-12-jer";
          const res=await fetch(url,{headers:{"user-agent":"Mozilla/5.0","accept":"text/html,application/xhtml+xml"}});
          const html=await res.text();
          const $=cheerio.load(html);
          const scripts=$('script[type="application/json"],script#__NUXT_DATA__').toArray();
          for(const el of scripts){
            const text=$(el).text().trim();
            if(!text.startsWith("["))continue;
            try{
              const p=JSON.parse(text);
              const resolve=v=>typeof v==="number"&&Number.isInteger(v)&&v>=0&&v<p.length?p[v]:v;
              const roots=p.filter(e=>e&&typeof e==="object"&&!Array.isArray(e)&&"mainVar" in e&&"variations" in e&&"slug" in e);
              console.log("NUXT_ROOT_COUNT",roots.length);
              for(const root of roots.slice(0,40)){
                const mv=resolve(root.mainVar);
                console.log("NUXT_ROOT",JSON.stringify({
                  slug:resolve(root.slug),
                  name:resolve(root.name),
                  title:resolve(root.title),
                  mainSku:mv&&typeof mv==="object"?resolve(mv.sku):null,
                  mainRef:mv&&typeof mv==="object"?resolve(mv.manRef):null
                }));
              }
            }catch(e){console.log("NUXT_PARSE_ERR",e.message);}
          }
          NODE

      - name: Inspect first Dentaltix Nuxt root graph
        run: |
          node --input-type=module <<'NODE'
          import * as cheerio from "cheerio";
          const url="https://www.dentaltix.com/es/3m/filtek-supreme-xte-kit-composite-profesional-12-jer";
          const res=await fetch(url,{headers:{"user-agent":"Mozilla/5.0","accept":"text/html,application/xhtml+xml"}});
          const html=await res.text();
          const $=cheerio.load(html);
          const text=$('script[type="application/json"],script#__NUXT_DATA__').toArray().map(el=>$(el).text().trim()).find(x=>x.startsWith("["));
          const p=JSON.parse(text);
          const roots=p.filter(e=>e&&typeof e==="object"&&!Array.isArray(e)&&"mainVar" in e&&"variations" in e&&"slug" in e);
          const root=roots.find(r=>p[r.name]==="Filtek Supreme XTE: Composite Restaurador Universal")||roots[0];
          console.log("ROOT_RAW",JSON.stringify(root));
          console.log("ROOT_KEYS",Object.keys(root));
          console.log("MAINVAR_RAW",JSON.stringify(root.mainVar),"MAINVAR_TARGET",JSON.stringify(p[root.mainVar]));
          console.log("VARIATIONS_RAW",JSON.stringify(root.variations),"VARIATIONS_TARGET",JSON.stringify(p[root.variations]));
          const seen=new Set();
          function walk(v,depth=0){
            if(depth>5)return;
            if(typeof v==="number"&&Number.isInteger(v)&&v>=0&&v<p.length){
              if(seen.has(v))return;
              seen.add(v);
              const target=p[v];
              if(target&&typeof target==="object"&&!Array.isArray(target)){
                if("manRef" in target||"sku" in target||"name" in target||"type" in target){
                  console.log("NODE",v,JSON.stringify(target));
                }
              }
              walk(target,depth+1);
              return;
            }
            if(Array.isArray(v)){for(const x of v)walk(x,depth+1);return;}
            if(v&&typeof v==="object"){for(const x of Object.values(v))walk(x,depth+1);}
          }
          walk(root.mainVar); walk(root.variations);
          NODE

      - name: Inspect Dental Express Tetric prices
        run: |
          node --input-type=module <<'NODE'
          import * as cheerio from "cheerio";
          const urls=[
            "https://dentalexpress.es/tetric-evoceram-jeringa-3g-ivoclar",
            "https://dentalexpress.es/tetric-evoceram-capsulas-ivoclar",
            "https://dentalexpress.es/tetric-evoceram-3-jeringas-ivoclar"
          ];
          for(const url of urls){
            const r=await fetch(url,{headers:{"user-agent":"Mozilla/5.0","accept":"text/html,application/xhtml+xml"}});
            const html=await r.text(); const $=cheerio.load(html);
            const body=$("body").text().replace(/\s+/g," ");
            const ld=$('script[type="application/ld+json"]').toArray().map(x=>$(x).text()).filter(Boolean);
            console.log("DEX_TETRIC",JSON.stringify({
              url,status:r.status,title:$("h1").first().text().replace(/\s+/g," ").trim(),
              visiblePrices:[...body.matchAll(/(\d{1,5}(?:[.,]\d{2})?)\s*€/g)].slice(0,20).map(m=>m[0]),
              priceSelectors:[
                [".price",$(".price").first().text()],
                [".special-price",$(".special-price").first().text()],
                [".old-price",$(".old-price").first().text()],
                ["[itemprop=price]",$("[itemprop=price]").first().attr("content")||$("[itemprop=price]").first().text()]
              ],
              ld:ld.filter(x=>/Product|Offer|price/i.test(x)).slice(0,6)
            }));
          }
          NODE

      - name: Inspect Dental Express 90 euro context
        run: |
          node --input-type=module <<'NODE'
          import * as cheerio from "cheerio";
          const url="https://dentalexpress.es/tetric-evoceram-jeringa-3g-ivoclar";
          const r=await fetch(url,{headers:{"user-agent":"Mozilla/5.0","accept":"text/html,application/xhtml+xml"}});
          const html=await r.text(),$=cheerio.load(html);
          const body=$("body").text().replace(/\s+/g," ");
          const pos=body.indexOf("90€");
          console.log("DEX_90_CONTEXT",body.slice(Math.max(0,pos-800),pos+800));
          const matches=[];
          $("*").each((_,el)=>{
            const t=$(el).clone().children().remove().end().text().replace(/\s+/g," ").trim();
            if(/\b90\s*€/.test(t)) matches.push({tag:el.tagName,id:$(el).attr("id"),cls:$(el).attr("class"),text:t.slice(0,700)});
          });
          console.log("DEX_90_ELEMENTS",JSON.stringify(matches.slice(0,30)));
          NODE

      - name: Inspect Dental Express Magento price config
        run: |
          node --input-type=module <<'NODE'
          const urls=[
            "https://dentalexpress.es/adhesivo-scotchbond-universal-plus-5ml-solventum",
            "https://dentalexpress.es/tetric-evoceram-jeringa-3g-ivoclar"
          ];
          for(const url of urls){
            const r=await fetch(url,{headers:{"user-agent":"Mozilla/5.0","accept":"text/html,application/xhtml+xml"}});
            const html=await r.text();
            console.log("\nDEX_MAGENTO_URL",url,"HTTP",r.status,"LEN",html.length);
            for(const re of [
              /priceConfig.{0,3000}/gi,
              /finalPrice.{0,1800}/gi,
              /basePrice.{0,1800}/gi,
              /priceAmount.{0,1200}/gi,
              /data-price-amount.{0,500}/gi,
              /productId.{0,1000}/gi,
              /priceBox.{0,1500}/gi
            ]){
              const m=html.match(re)||[];
              console.log("PATTERN",String(re),JSON.stringify(m.slice(0,12)));
            }
          }
          NODE

      - name: Inspect DentalCost Tetric candidates
        run: |
          npx tsx -e '
            import { discoverSupplierProductUrls } from "./src/connectors/live-search";
            import { fetchDentalCostProduct } from "./src/connectors/dentalcost";
            (async()=>{
              const query="Tetric EvoCeram";
              const found=await discoverSupplierProductUrls("dentalcost",query,fetch,5);
              console.log("DISCOVERED",JSON.stringify(found,null,2));
              for(const url of found.urls){
                try{
                  const result=await fetchDentalCostProduct(url,fetch);
                  console.log("CANDIDATE",url,JSON.stringify(result.offers.map(o=>({name:o.rawName,sku:o.supplierSku,ref:o.manufacturerReference,price:o.salePrice??o.regularPrice,presentation:o.presentation,quantity:o.quantity,unit:o.unit,shade:o.shade})).slice(0,12),null,2));
                }catch(e){console.log("CANDIDATE_ERROR",url,e instanceof Error?e.message:String(e));}
              }
            })().catch(e=>{console.error(e);process.exit(1);});
          '

      - name: Inspect Dentaltix variant stock fields
        run: |
          node --input-type=module <<'NODE'
          import * as cheerio from "cheerio";
          const url="https://www.dentaltix.com/es/ivoclar-vivadent/tetric-evoceram-cavifil-20-x-02gr";
          const r=await fetch(url,{headers:{"user-agent":"Mozilla/5.0","accept":"text/html,application/xhtml+xml"}});
          const html=await r.text();
          const $=cheerio.load(html);
          for(const el of $('script[type="application/json"],script#__NUXT_DATA__').toArray()){
            const text=$(el).text().trim();
            if(!text.startsWith("["))continue;
            try{
              const payload=JSON.parse(text);
              const resolve=v=>Number.isInteger(v)&&v>=0&&v<payload.length?payload[v]:v;
              const roots=payload.filter(x=>x&&typeof x==="object"&&!Array.isArray(x)&&"mainVar" in x&&"variations" in x);
              for(const root of roots){
                const name=resolve(root.name);
                if(typeof name!=="string"||!/Tetric EvoCeram/i.test(name))continue;
                const vals=[];
                const add=v=>{
                  const obj=resolve(v);
                  if(!obj||typeof obj!=="object"||Array.isArray(obj)||!("sku" in obj))return;
                  const out={};
                  for(const [k,val] of Object.entries(obj)){
                    if(/stock|avail|inventory|qty|quant|delivery|lead|backorder|status|dispon|almacen/i.test(k))out[k]=resolve(val);
                  }
                  out.sku=resolve(obj.sku);out.manRef=resolve(obj.manRef);out.name=resolve(obj.name);
                  vals.push(out);
                };
                add(root.mainVar);
                const variations=resolve(root.variations);
                if(variations&&typeof variations==="object"&&!Array.isArray(variations)){
                  for(const value of Object.values(variations)){
                    const resolved=resolve(value);
                    if(Array.isArray(resolved))for(const nested of resolved)add(nested);else add(resolved);
                  }
                }
                console.log("DENTALTIX_STOCK_FIELDS",JSON.stringify(vals.slice(0,20),null,2));
              }
            }catch{}
          }
          NODE

      - name: Inspect Ortolan tax and stock metadata
        run: |
          node --input-type=module <<'NODE'
          import * as cheerio from "cheerio";
          const url="https://ortolan.es/es/busqueda?controller=search&s=Tetric%20EvoCeram";
          const r=await fetch(url,{headers:{"user-agent":"Mozilla/5.0","accept":"text/html,application/xhtml+xml"}});
          const html=await r.text();
          const $=cheerio.load(html);
          const cards=$('article[data-id-product]').toArray().map(el=>{
            const node=$(el);
            return {
              id:node.attr("data-id-product"),
              attrs:el.attribs,
              text:node.text().replace(/\s+/g," ").trim().slice(0,1800),
              html:$.html(node).slice(0,6000)
            };
          }).filter(x=>/Tetric EvoCeram/i.test(x.text)).slice(0,3);
          console.log("ORTOLAN_CARDS",JSON.stringify(cards,null,2));
          for(const re of [
            /"item_name":"TETRIC EVOCERAM".{0,2500}/gi,
            /availability.{0,1000}/gi,
            /stock.{0,1000}/gi,
            /tax.{0,1000}/gi,
            /iva.{0,1000}/gi,
            /price_amount.{0,1000}/gi
          ]){
            console.log("ORTOLAN_PATTERN",String(re),JSON.stringify((html.match(re)||[]).slice(0,20),null,2));
          }
          NODE
