name: Connector health

on:
  workflow_dispatch:
  push:
    paths:
      - "src/connectors/**"
      - "scripts/connector-health.ts"
      - "package-lock.json"
      - ".github/workflows/connector-health.yml"
  schedule:
    - cron: "47 5,11,17,23 * * *"

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.13.1"
          cache: npm
      - run: npm ci
      - run: npm run health

# Health is observational only. refresh-prices.yml is the sole writer of connector-status.json.
# five-supplier-health-trigger
