name: Connector health

on:
  workflow_dispatch:
  schedule:
    - cron: "41 6 * * *"
  push:
    paths:
      - ".github/workflows/connector-health.yml"
      - "scripts/connector-health.ts"

permissions:
  contents: write

concurrency:
  group: connector-health
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"
      - run: npm install
      - run: npm run health
      - name: Commit health status
        run: |
          if git diff --quiet -- data/connector-status.json public/data/connector-status.json; then
            echo "No health changes"
            exit 0
          fi
          git config user.name "dental-price-bot"
          git config user.email "dental-price-bot@users.noreply.github.com"
          git add data/connector-status.json public/data/connector-status.json
          git commit -m "data: update connector health"
          git push