name: Connector health

on:
  workflow_dispatch:
  schedule:
    - cron: "41 6 * * *"
  push:
    paths:
      - ".github/workflows/connector-health.yml"
      - "scripts/connector-health.ts"

permissions:
  contents: write

concurrency:
  group: dental-price-data-writes
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "22.13.1"
          cache: npm
      - run: npm ci
      - run: npm run health
      - name: Commit health status
        run: |
          if [ -z "$(git status --porcelain -- data/connector-status.json public/data/connector-status.json)" ]; then
            echo "No health changes"
            exit 0
          fi
          git config user.name "dental-price-bot"
          git config user.email "dental-price-bot@users.noreply.github.com"
          git add data/connector-status.json public/data/connector-status.json
          git commit -m "data: update connector health"
          git pull --rebase origin main
          git push origin HEAD:main